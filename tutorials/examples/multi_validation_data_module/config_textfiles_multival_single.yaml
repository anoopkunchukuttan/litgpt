# Example 1: Single validation set (backward compatible with TextFiles)
# This works exactly like the original TextFiles module

model_name: pythia-14m
out_dir: out/pretrain/single_val_example
precision: bf16-mixed

data:
  class_path: litgpt.data.TextFilesMultiVal
  init_args:
    train_data_path: /path/to/train
    val_data_path: /path/to/val      # Single path
    num_workers: 4

train:
  save_interval: 1000
  log_interval: 1
  global_batch_size: 512
  micro_batch_size: 4
  max_tokens: 1000000000
  max_norm: 1.0
  min_lr: 4e-5

eval:
  interval: 1000
  max_iters: 100
  initial_validation: true
  final_validation: true

tokenizer_dir: checkpoints/EleutherAI/pythia-14m

logger_name: wandb
log:
  project: litgpt-single-val
  run: single-val-run1

# Expected output:
# iter 1000: val loss 2.4560
# WandB metrics: val/loss, val/ppl
